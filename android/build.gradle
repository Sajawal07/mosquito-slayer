// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        tasks.matching { 
            it.name.contains("extractReleaseAnnotations") || it.name.startsWith("lintVital")
        }.configureEach {
            enabled = false
        }

        def createTypedefTask = project.tasks.register("createDummyTypedefs") {
            doLast {
                def typedefFile = file("${project.buildDir}/intermediates/annotations_typedef_file/release/extractReleaseAnnotations/typedefs.txt")
                typedefFile.parentFile.mkdirs()
                if (!typedefFile.exists()) {
                    typedefFile.createNewFile()
                }
            }
        }

        tasks.matching { it.name.contains("syncReleaseLibJars") }.configureEach {
            dependsOn createTypedefTask
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
